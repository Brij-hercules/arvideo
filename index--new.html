<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Postcard AR Scanner</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="assets/mindar-image-aframe.prod.js"></script>
    <script>
        // Register Stabilizer component for A-Frame
        AFRAME.registerComponent('stabilizer', {
            schema: {
                targetId: { type: 'string' },
                lerpFactor: { type: 'number', default: 0.15 } // Responsive baseline tracking
            },
            init: function () {
                this.targetEl = document.getElementById(this.data.targetId);
                this.found = false;

                this.currPos = new THREE.Vector3();
                this.currQuat = new THREE.Quaternion();
                this.currScale = new THREE.Vector3();

                this.targetPos = new THREE.Vector3();
                this.targetQuat = new THREE.Quaternion();
                this.targetScale = new THREE.Vector3();

                this.firstTime = true;

                if (this.targetEl) {
                    this.targetEl.addEventListener('targetFound', () => {
                        this.found = true;
                        this.firstTime = true;
                        this.el.setAttribute('visible', 'true');
                    });
                    this.targetEl.addEventListener('targetLost', () => {
                        this.found = false;
                        this.el.setAttribute('visible', 'false');
                    });
                }
            },
            tick: function () {
                if (!this.found || !this.targetEl) return;

                const targetObj = this.targetEl.object3D;
                const containerObj = this.el.object3D;

                // Force matrix recalculation to get the current frame's true position and avoid lagging a frame behind
                targetObj.updateMatrixWorld(true);
                targetObj.matrixWorld.decompose(this.targetPos, this.targetQuat, this.targetScale);

                if (this.firstTime) {
                    this.currPos.copy(this.targetPos);
                    this.currQuat.copy(this.targetQuat);
                    this.currScale.copy(this.targetScale);
                    this.firstTime = false;
                } else {
                    // Adaptive filtering: scale down interpolation factor for minor movements (high frequency tracking jitter)
                    const dist = this.currPos.distanceTo(this.targetPos);
                    const angle = this.currQuat.angleTo(this.targetQuat);

                    let pFactor = this.data.lerpFactor;
                    let rFactor = this.data.lerpFactor;

                    if (dist < 0.08) {
                        pFactor = this.data.lerpFactor * (dist / 0.08);
                        if (pFactor < 0.015) pFactor = 0.015; // Minimum step to avoid complete lock
                    }
                    if (angle < 0.12) {
                        rFactor = this.data.lerpFactor * (angle / 0.12);
                        if (rFactor < 0.015) rFactor = 0.015;
                    }

                    this.currPos.lerp(this.targetPos, pFactor);
                    this.currScale.lerp(this.targetScale, this.data.lerpFactor);
                    this.currQuat.slerp(this.targetQuat, rFactor);
                }

                // Apply smoothed values
                containerObj.position.copy(this.currPos);
                containerObj.quaternion.copy(this.currQuat);
                containerObj.scale.copy(this.currScale);
            }
        });
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20000;
            transition: opacity 0.5s ease;
        }

        #start-btn {
            padding: 18px 45px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
            display: none;
            /* 初期隱藏，等待系統或超時 */
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        .loading-text {
            color: #888;
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
            padding: 0 30px;
            line-height: 1.6;
        }

        a-scene {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        canvas.a-canvas {
            background-color: transparent !important;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>

<body>
    <div id="start-overlay">
        <h2 style="color: white; margin-bottom: 5px;">AR 明信片掃描</h2>
        <p class="loading-text" id="init-text">請按下按鈕並允許相機權限<br>即可開始體驗</p>
        <button id="start-btn" style="display: block;">進入掃描模式</button>
    </div>

    <div id="ui-overlay">
        <div id="scanning-indicator" class="hidden">
            <div class="scanner-frame"></div>
            <p>請將相機對準明信片<br><span
                    style="font-size: 11px; color: rgba(255,255,255,0.7); font-weight: normal; display: block; margin-top: 5px;">請確保明信片直向放置
                    (Don't rotate card)</span></p>
        </div>
        <div id="tap-to-play" class="overlay hidden" style="background: rgba(0,0,0,0.8); z-index: 10001;">
            <div style="font-size: 60px;">▶️</div>
            <p>點擊播放影片</p>
        </div>
        <button id="sound-btn" class="hidden">
            <span class="icon">🔇</span> <span class="text">Tap for Sound</span>
        </button>

        <!-- Video Size Adjustment Panel: always visible during scanning, drag to fit video to photo -->
        <div id="video-adjust-panel" style="position: absolute; bottom: 30vh; width: 100%; text-align: center; z-index: 10000; pointer-events: auto; display: none;">
            <div style="color:white; font-size:13px; font-weight:bold; text-shadow:0 1px 3px black; margin-bottom:4px;">Adjust Video Size 🔄</div>
            <input type="range" id="video-scale-slider" min="0.5" max="1.3" step="0.005" value="1.0"
                style="width: 65%; accent-color: #00f2fe;">
            <div style="color:#00f2fe; font-size:12px; margin-top:2px;">Scale: <span id="scale-value-label">1.00</span></div>
        </div>
    </div>

    <a-scene
        mindar-image="imageTargetSrc: assets/targets.mind?v=1325; maxTrack: 1; autoStart: true; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.001; filterBeta: 10; missTolerance: 5; warmupTolerance: 5;"
        color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-assets>
            <video id="shared-video" playsinline webkit-playsinline loop="true" preload="auto" muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- MindAR Targets (invisible, used to trigger events) -->
        <a-entity id="target0" mindar-image-target="targetIndex: 0" class="ar-target"
            data-video="assets/10_1.mp4"></a-entity>
        <a-entity id="target1" mindar-image-target="targetIndex: 1" class="ar-target"
            data-video="assets/9_1.mp4"></a-entity>
        <a-entity id="target2" mindar-image-target="targetIndex: 2" class="ar-target"
            data-video="assets/8_1.mp4"></a-entity>
        <a-entity id="target3" mindar-image-target="targetIndex: 3" class="ar-target"
            data-video="assets/7_1.mp4"></a-entity>
        <a-entity id="target4" mindar-image-target="targetIndex: 4" class="ar-target"
            data-video="assets/6_1.mp4"></a-entity>
        <a-entity id="target5" mindar-image-target="targetIndex: 5" class="ar-target"
            data-video="assets/5_1.mp4"></a-entity>
        <a-entity id="target6" mindar-image-target="targetIndex: 6" class="ar-target"
            data-video="assets/4_1.mp4"></a-entity>
        <a-entity id="target7" mindar-image-target="targetIndex: 7" class="ar-target"
            data-video="assets/3_1.mp4"></a-entity>
        <a-entity id="target8" mindar-image-target="targetIndex: 8" class="ar-target"
            data-video="assets/2_1.mp4"></a-entity>
        <a-entity id="target9" mindar-image-target="targetIndex: 9" class="ar-target"
            data-video="assets/1_1.mp4"></a-entity>

        <!-- Stabilized World-Space Video Containers -->
        <a-entity id="videoContainer0" stabilizer="targetId: target0" visible="false">
            <a-video src="#shared-video" position="0 0 0" height="0.6667" width="1"></a-video>
        </a-entity>
        <a-entity id="videoContainer1" stabilizer="targetId: target1" visible="false">
            <a-video src="#shared-video" position="0 0 0" height="0.6667" width="1"></a-video>
        </a-entity>
        <a-entity id="videoContainer2" stabilizer="targetId: target2" visible="false">
            <a-video src="#shared-video" position="0 0 0" height="0.6667" width="1"></a-video>
        </a-entity>
        <a-entity id="videoContainer3" stabilizer="targetId: target3" visible="false">
            <a-video src="#shared-video" position="0 0 0" height="0.6667" width="1"></a-video>
        </a-entity>
        <a-entity id="videoContainer4" stabilizer="targetId: target4" visible="false">
            <a-video src="#shared-video" position="0 0 0" height="0.6667" width="1"></a-video>
        </a-entity>
        <a-entity id="videoContainer5" stabilizer="targetId: target5" visible="false">
            <a-video src="#shared-video" position="0 0 0" height="0.6667" width="1"></a-video>
        </a-entity>
        <a-entity id="videoContainer6" stabilizer="targetId: target6" visible="false">
            <a-video src="#shared-video" position="0 0 0" height="0.6667" width="1"></a-video>
        </a-entity>
        <a-entity id="videoContainer7" stabilizer="targetId: target7" visible="false">
            <a-video src="#shared-video" position="0 0 0" height="0.6667" width="1"></a-video>
        </a-entity>
        <a-entity id="videoContainer8" stabilizer="targetId: target8" visible="false">
            <a-video src="#shared-video" position="0 0 0" height="0.6667" width="1"></a-video>
        </a-entity>
        <a-entity id="videoContainer9" stabilizer="targetId: target9" visible="false">
            <a-video src="#shared-video" position="0 0 0" height="0.6667" width="1"></a-video>
        </a-entity>
    </a-scene>

    <div id="debug-console">
        <button class="debug-clear-btn"
            onclick="document.querySelectorAll('.debug-line').forEach(el => el.remove())">CLEAR</button>
        <div
            style="font-weight: bold; border-bottom: 1px dashed var(--primary-color); padding-bottom: 4px; margin-bottom: 8px;">
            MOBILE DEBUG CONSOLE</div>
    </div>

    <script>
        window.onload = function () {
            const sceneEl = document.querySelector('a-scene');
            const startBtn = document.querySelector('#start-btn');
            const initText = document.querySelector('#init-text');
            const overlay = document.querySelector('#start-overlay');
            const indicator = document.querySelector('#scanning-indicator');
            const sharedVideo = document.getElementById('shared-video');
            const soundBtn = document.getElementById('sound-btn');

            let activeVid = null;
            let activeTargetIndex = null;
            let targetDimensions = {};

            function logToScreen(msg) {
                console.log("[DEBUG]", msg);
                const consoleEl = document.getElementById('debug-console');
                if (!consoleEl) return;
                const line = document.createElement('div');
                line.className = 'debug-line';

                const now = new Date();
                const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');

                line.innerHTML = `<span class="debug-time">[${timeStr}]</span>${msg}`;
                consoleEl.appendChild(line);
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }

            // Mute / Unmute overlay controller
            function toggleMute() {
                if (!activeVid) return;
                sharedVideo.muted = !sharedVideo.muted;
                updateSoundButton();
                logToScreen("Muted state toggled. Muted = " + sharedVideo.muted);
            }

            function updateSoundButton() {
                if (!activeVid) {
                    soundBtn.classList.add('hidden');
                    return;
                }
                soundBtn.classList.remove('hidden');
                const icon = soundBtn.querySelector('.icon');
                const text = soundBtn.querySelector('.text');
                if (sharedVideo.muted) {
                    icon.textContent = "🔇";
                    text.textContent = "Tap for Sound";
                } else {
                    icon.textContent = "🔊";
                    text.textContent = "Sound On";
                }
            }

            soundBtn.onclick = function (e) {
                e.stopPropagation();
                toggleMute();
            };

            // Global screen tap to unmute when video is actively running
            window.addEventListener('click', (e) => {
                if (overlay.style.display !== 'none') return;
                // Prevent intercepting debug controls or standard buttons
                if (e.target.closest('#debug-console') || e.target.closest('#sound-btn') || e.target.closest('#start-btn')) {
                    return;
                }
                if (activeVid) {
                    toggleMute();
                }
            });

            // Periodically check if controller is ready to fetch target dimensions and cache them
            let checkTargetsInterval = setInterval(() => {
                try {
                    const arSystem = sceneEl.systems['mindar-image-system'];
                    if (arSystem && arSystem.controller && arSystem.controller.imageTargets && arSystem.controller.imageTargets.length > 0) {
                        clearInterval(checkTargetsInterval);
                        const targets = arSystem.controller.imageTargets;
                        logToScreen("MindAR loaded " + targets.length + " targets dimensions.");
                        targets.forEach((t, idx) => {
                            // Determine width/height depending on how MindAR structures the target object
                            const w = t.width || (t.dimensions ? t.dimensions[0] : 1);
                            const h = t.height || (t.dimensions ? t.dimensions[1] : 0.6667);
                            targetDimensions[idx] = {
                                width: w,
                                height: h,
                                aspectRatio: w / h
                            };
                            logToScreen("Target " + idx + ": size=" + w + "x" + h + ", ratio=" + (w / h).toFixed(3));
                        });
                    }
                } catch (e) {
                    // Wait for initialization
                }
            }, 100);

            sceneEl.addEventListener('ready', () => {
                logToScreen("MindAR ready event fired.");
            });

            startBtn.onclick = function () {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 500);
                indicator.classList.remove('hidden');
                logToScreen("Scanning started.");

                // Ensure engine start
                try {
                    const arSystem = sceneEl.systems['mindar-image-system'];
                    if (arSystem && !arSystem.main) {
                        arSystem.start();
                        logToScreen("AR System started manually.");
                    }
                } catch (e) {
                    logToScreen("Error starting system: " + e.message);
                }

                // Unlock the single shared video element synchronously inside user event
                if (sharedVideo) {
                    sharedVideo.play().then(() => {
                        sharedVideo.pause();
                        sharedVideo.currentTime = 0;
                        logToScreen("Shared video unlocked successfully.");
                    }).catch((err) => {
                        logToScreen("Shared video unlock failed: " + err.message);
                    });
                }

                // Check background camera video element
                setTimeout(() => {
                    const sv = document.querySelector('video[autoplay]');
                    if (sv) {
                        if (sv.paused) sv.play().catch(() => { });
                        sv.style.zIndex = "-1";
                        sv.style.backgroundColor = "transparent";
                        logToScreen("Background camera adjusted.");
                    }
                }, 1000);
            };

            document.querySelectorAll('.ar-target').forEach(t => {
                const targetIndexAttr = t.getAttribute('mindar-image-target');
                const targetIndexMatch = targetIndexAttr.match(/targetIndex:\s*(\d+)/);
                const targetIndex = targetIndexMatch ? parseInt(targetIndexMatch[1]) : 0;

                const videoContainer = document.getElementById("videoContainer" + targetIndex);
                const aVideo = videoContainer ? videoContainer.querySelector('a-video') : null;

                t.addEventListener('targetFound', () => {
                    const videoSrc = t.getAttribute('data-video');
                    logToScreen("Target found! index=" + targetIndex + ", video=" + videoSrc);

                    indicator.classList.add('hidden');
                    activeTargetIndex = targetIndex;

                    let P_h = 0.6667; // fallback height
                    if (targetDimensions[targetIndex]) {
                        const dims = targetDimensions[targetIndex];
                        P_h = dims.height / dims.width;
                    }

                    // Load saved scale or default to 1.0
                    const savedScale = parseFloat(localStorage.getItem('arVideoScale') || '1.0');
                    document.getElementById('video-scale-slider').value = savedScale;
                    document.getElementById('scale-value-label').textContent = savedScale.toFixed(2);

                    if (aVideo) {
                        aVideo.setAttribute('width', '1');
                        aVideo.setAttribute('height', P_h.toString());
                        aVideo.setAttribute('scale', `${savedScale} ${savedScale} 1`);
                        logToScreen(`Video shape: 1x${P_h.toFixed(3)}, scale: ${savedScale}`);
                    }

                    document.getElementById('video-adjust-panel').style.display = 'block';


                    // For guaranteed autoplay on iOS Safari, ensure we load muted. 
                    // User can tap the screen or speaker icon to unmute.
                    sharedVideo.muted = true;
                    sharedVideo.src = videoSrc;
                    logToScreen("Loading and playing video source: " + videoSrc);
                    activeVid = sharedVideo;

                    sharedVideo.play().then(() => {
                        logToScreen("Playback started successfully (muted).");
                        updateSoundButton();
                    }).catch(err => {
                        logToScreen("Play blocked: " + err.message + ". Showing Tap to Play overlay.");
                        document.querySelector('#tap-to-play').classList.remove('hidden');
                    });
                });

                t.addEventListener('targetLost', () => {
                    logToScreen("Target lost. index=" + targetIndex);
                    indicator.classList.remove('hidden');
                    document.getElementById('video-adjust-panel').style.display = 'none';
                    document.querySelector('#tap-to-play').classList.add('hidden');

                    if (activeTargetIndex === targetIndex) {
                        sharedVideo.pause();
                        sharedVideo.src = "";
                        activeTargetIndex = null;
                        activeVid = null;
                        updateSoundButton();
                    }
                });
            });

            // Slider: live-adjust video scale and save to localStorage
            document.getElementById('video-scale-slider').addEventListener('input', function (e) {
                const val = parseFloat(e.target.value);
                document.getElementById('scale-value-label').textContent = val.toFixed(2);
                localStorage.setItem('arVideoScale', val.toString());
                if (activeTargetIndex !== null) {
                    const vc = document.getElementById("videoContainer" + activeTargetIndex);
                    const av = vc ? vc.querySelector('a-video') : null;
                    if (av) av.setAttribute('scale', `${val} ${val} 1`);
                }
            });

            document.querySelector('#tap-to-play').onclick = function () {
                if (activeVid) {
                    logToScreen("Tap to play clicked. Forcing playback...");
                    sharedVideo.muted = false; // Play with audio on explicit tap-to-play click
                    activeVid.play().then(() => {
                        logToScreen("Forced playback succeeded.");
                        updateSoundButton();
                    }).catch(err => {
                        logToScreen("Forced play failed: " + err.message);
                    });
                }
                this.classList.add('hidden');
            };
        };
    </script>
</body>

</html>
